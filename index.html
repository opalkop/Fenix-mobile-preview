<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>FENIX Mobile — Maze Studio</title><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color:#17202a;background:#eef1f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding-bottom:150px}.topbar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr 48px;gap:12px;align-items:center;padding:12px 14px;background:#111827;color:#fff}.topbar h1{font-size:1.1rem;margin:2px 0}.eyebrow{margin:0;text-transform:uppercase;letter-spacing:.14em;font-size:.68rem;font-weight:800;color:#f59e0b}.icon-button{width:44px;height:44px;border:0;border-radius:12px;background:#f59e0b;font-size:1.5rem}main{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;box-shadow:0 8px 24px #11182714;border:1px solid #e5e7eb;padding:16px;margin-bottom:14px}.preview{padding:0;overflow:hidden}.toolbar{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #e5e7eb;font-size:.8rem}.canvas-wrap{display:grid;place-items:center;padding:12px;background:#dfe4ea;overflow:auto}canvas{display:block;width:min(100%,620px);height:auto;background:#fff}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:6px;font-size:.82rem;font-weight:800}input{width:100%;min-height:44px;border:1px solid #cbd5e1;border-radius:12px;padding:10px}.cart-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #e5e7eb}.small-btn,.bottom button{border:0;border-radius:12px;padding:10px 12px;font-weight:800}.bottom{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px;background:#fff;border-top:1px solid #ddd}.bottom button{min-height:50px}.primary{background:#f59e0b}.wide{grid-column:1/-1;background:#111827;color:#fff}@media(max-width:430px){.field-grid{grid-template-columns:1fr}}@media(min-width:760px){body{padding-bottom:24px}.bottom{position:static;max-width:1100px;margin:auto}.topbar{position:static}}</style></head><body><header class="topbar"><div><p class="eyebrow">FENIX Mobile — koszyk źródłowy</p><h1>Maze Studio</h1></div><button id="addToCart" class="icon-button" aria-label="Dodaj do Koszyka">＋</button></header><main><section class="card preview"><div class="toolbar"><span id="status">Gotowy</span><span id="seedLabel">Seed: —</span></div><div class="canvas-wrap"><canvas id="mazeCanvas" width="900" height="1165"></canvas></div></section><section class="card"><p class="eyebrow">Ustawienia</p><h2>Parametry labiryntu</h2><div class="field-grid"><label>Kolumny<input id="cols" type="number" min="6" max="45" value="18"></label><label>Wiersze<input id="rows" type="number" min="8" max="58" value="24"></label><label>Grubość ścian<input id="lineWidth" type="range" min="2" max="12" value="5"></label><label>Tytuł strony<input id="pageTitle" type="text" value="Find the Way!" maxlength="80"></label></div></section><section class="card"><p class="eyebrow">Koszyk do PC</p><h2 id="cartTitle">0 stron</h2><div id="cartList"><p>Koszyk jest pusty.</p></div><p>Eksport zawiera tylko receptury stron: seed i ustawienia. Finalne składanie oraz PDF pozostają w prywatnym FENIX PC.</p></section></main><nav class="bottom"><button id="duplicate">Duplikuj</button><button id="newVariant" class="primary">Nowy wariant</button><button id="download">PNG</button><button id="exportMobile" class="wide">Przenieś Koszyk do FENIX PC</button></nav><script>"use strict";const canvas=document.querySelector("#mazeCanvas"),ctx=canvas.getContext("2d"),colsInput=document.querySelector("#cols"),rowsInput=document.querySelector("#rows"),lineWidthInput=document.querySelector("#lineWidth"),titleInput=document.querySelector("#pageTitle"),statusEl=document.querySelector("#status"),seedLabel=document.querySelector("#seedLabel");let currentSeed=Date.now()>>>0,currentMaze=null;function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}function clampInt(v,min,max,f){const n=parseInt(v,10);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):f}function buildMaze(cols,rows,seed){const random=mulberry32(seed),cells=Array.from({length:rows},()=>Array.from({length:cols},()=>({v:false,w:[true,true,true,true]}))),stack=[[0,0]],dirs=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];cells[0][0].v=true;while(stack.length){const[x,y]=stack[stack.length-1],choices=[];for(const[dx,dy,wall,opposite]of dirs){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<cols&&ny<rows&&!cells[ny][nx].v)choices.push([nx,ny,wall,opposite])}if(!choices.length){stack.pop();continue}const[nx,ny,wall,opposite]=choices[Math.floor(random()*choices.length)];cells[y][x].w[wall]=false;cells[ny][nx].w[opposite]=false;cells[ny][nx].v=true;stack.push([nx,ny])}cells[0][0].w[3]=false;cells[rows-1][cols-1].w[1]=false;return{cols,rows,cells,seed}}function drawMaze(maze){const{cols,rows,cells}=maze,marginX=80,top=170,bottom=90,areaW=canvas.width-marginX*2,areaH=canvas.height-top-bottom,cell=Math.min(areaW/cols,areaH/rows),mazeW=cell*cols,mazeH=cell*rows,startX=(canvas.width-mazeW)/2,startY=top+(areaH-mazeH)/2;ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#111827";ctx.textAlign="center";ctx.font="700 42px Arial";ctx.fillText(titleInput.value.trim()||"Find the Way!",canvas.width/2,82);ctx.strokeStyle="#111827";ctx.lineWidth=Number(lineWidthInput.value);ctx.beginPath();for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const px=startX+x*cell,py=startY+y*cell,w=cells[y][x].w;if(w[0]){ctx.moveTo(px,py);ctx.lineTo(px+cell,py)}if(w[1]){ctx.moveTo(px+cell,py);ctx.lineTo(px+cell,py+cell)}if(w[2]){ctx.moveTo(px,py+cell);ctx.lineTo(px+cell,py+cell)}if(w[3]){ctx.moveTo(px,py);ctx.lineTo(px,py+cell)}}ctx.stroke()}function regenerate(newSeed=true){const cols=clampInt(colsInput.value,6,45,18),rows=clampInt(rowsInput.value,8,58,24);if(newSeed)currentSeed=(Date.now()+Math.floor(Math.random()*1e9))>>>0;currentMaze=buildMaze(cols,rows,currentSeed);drawMaze(currentMaze);seedLabel.textContent=`Seed: ${currentSeed}`;statusEl.textContent="Labirynt wygenerowany"}function getCart(){try{return JSON.parse(localStorage.getItem("fenix-mobile-cart-v2")||"[]")}catch{return[]}}function saveCart(c){localStorage.setItem("fenix-mobile-cart-v2",JSON.stringify(c));renderCart()}function addToCart(){const cart=getCart();cart.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),module:"maze-studio",title:titleInput.value.trim()||"Maze",seed:currentSeed,settings:{cols:currentMaze.cols,rows:currentMaze.rows,lineWidth:Number(lineWidthInput.value)},createdAt:new Date().toISOString()});saveCart(cart);statusEl.textContent=`Dodano do Koszyka (${cart.length})`}function renderCart(){const cart=getCart(),box=document.querySelector("#cartList");document.querySelector("#cartTitle").textContent=`${cart.length} stron`;box.innerHTML=cart.length?cart.map(x=>`<div class="cart-row"><div><strong>${x.title}</strong><br><small>${x.settings.cols}×${x.settings.rows} · seed ${x.seed}</small></div><button class="small-btn" data-id="${x.id}">Usuń</button></div>`).join(""):"<p>Koszyk jest pusty.</p>";box.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>saveCart(cart.filter(x=>x.id!==b.dataset.id)))}function exportMobile(){const pages=getCart();if(!pages.length){statusEl.textContent="Koszyk jest pusty";return}const data={type:"FENIX_MOBILE_PROJECT",formatVersion:1,createdAt:new Date().toISOString(),pages};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download=`fenix-mobile-${new Date().toISOString().slice(0,10)}.fenixmobile`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);statusEl.textContent="Plik do FENIX PC został zapisany"}document.querySelector("#newVariant").onclick=()=>regenerate(true);document.querySelector("#duplicate").onclick=()=>{drawMaze(currentMaze);statusEl.textContent="Duplikat zachowuje ten sam układ"};document.querySelector("#download").onclick=()=>{const a=document.createElement("a");a.download=`fenix-maze-${currentSeed}.png`;a.href=canvas.toDataURL("image/png");a.click()};document.querySelector("#addToCart").onclick=addToCart;document.querySelector("#exportMobile").onclick=exportMobile;[colsInput,rowsInput].forEach(i=>i.onchange=()=>regenerate(true));lineWidthInput.oninput=()=>drawMaze(currentMaze);titleInput.oninput=()=>drawMaze(currentMaze);renderCart();regenerate(false);</script></body></html>
