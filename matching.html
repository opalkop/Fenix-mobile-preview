<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e151c"><title>FPM 3.4 · Matching Studio</title><link rel="stylesheet" href="fpm.css?v=13"><style>.asset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.asset-card{padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.asset-card.selected{outline:2px solid currentColor}.asset-card.disabled{opacity:.45}.asset-card img{width:100%;aspect-ratio:1;object-fit:contain}.manual-pairs{display:grid;gap:8px}.pair-row{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center}.preview canvas{width:100%;height:auto}.preview-tabs{display:flex;gap:8px;margin-bottom:10px}.preview-tabs button.active{font-weight:900}.edit-badge{display:none;margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--soft);font-size:12px;font-weight:900;color:#c64d18}.edit-badge.on{display:block}</style></head><body><header class="top"><div><strong>FPM 3.4 · FENIX Portable Mobile</strong><small>Matching Studio · logika FPP + workflow FPM</small></div><b>TEST</b></header><main><article class="card"><span>MATCHING · FPP → FPM</span><h2>Matching Studio</h2><p id="projectInfo"></p><div id="editBadge" class="edit-badge">TRYB EDYCJI · zapisujesz tę samą stronę</div></article><details open><summary>1. Typ ćwiczenia</summary><div class="fields"><label>Tryb<select id="mode"><option value="alphabet">Wielka → mała litera</option><option value="identical">Obrazek → ten sam obrazek</option><option value="shadow">Obrazek → cień/sylwetka</option><option value="word-image">Słowo → obrazek</option><option value="number-quantity">Liczba → ilość</option><option value="manual">Pary ręczne</option></select></label><label>Liczba par<input id="pairCount" type="number" min="3" max="8" value="5"></label><label>Seed<input id="seed" value="fenix-match"></label><label>Mieszaj prawą kolumnę<select id="shuffle"><option value="yes">Tak</option><option value="no">Nie</option></select></label></div></details><details id="assetSection" open><summary>2. Assety</summary><div class="actions"><button id="tabProject" type="button">Assety projektu</button><button id="tabLibrary" type="button">Biblioteka Feniksa</button></div><div id="projectPane"><div id="assetGrid" class="asset-grid"></div></div><div id="libraryPane" hidden><div id="libraryGrid" class="asset-grid"></div></div></details><details id="shadowSection"><summary>3. Sylwetka SVG</summary><div class="fields"><label>Wariant<select id="shadowStyle"><option value="solid">Pełna sylwetka</option><option value="gray">Szara sylwetka</option><option value="outline">Sam kontur</option></select></label><label id="shadowOpacityWrap">Krycie sylwetki (%)<input id="shadowOpacity" type="number" min="10" max="100" value="55"></label><label id="shadowStrokeWrap">Grubość obrysu<input id="shadowStroke" type="number" min="1" max="24" value="5"></label><label>Strona oryginału<select id="shadowSide"><option value="left">Oryginał po lewej</option><option value="right">Oryginał po prawej</option><option value="random">Losuj stronę</option></select></label></div></details><details id="manualSection"><summary>4. Pary ręczne / etykiety</summary><div id="manualPairs" class="manual-pairs"></div><div class="actions"><button id="addPair" type="button">＋ Dodaj parę</button><button id="autoAlphabet" type="button">A–Z</button></div></details><details open><summary>5. Wygląd i układ</summary><div class="fields"><label>Rozmiar tekstu<input id="textSize" type="number" min="36" max="120" value="66"></label><label id="assetSizeWrap">Rozmiar assetu (%)<input id="assetSize" type="number" min="30" max="300" value="100"></label><label>Odstęp między parami<input id="rowGap" type="number" min="120" max="900" value="220"></label><label id="autoSpacingWrap">Auto-dopasuj odstęp<select id="autoSpacing"><option value="yes">Tak</option><option value="no">Nie</option></select></label><label id="quantitySizeWrap">Wielkość symboli ilości<input id="quantitySize" type="number" min="18" max="70" value="38"></label><label id="quantityGapWrap">Odstęp symboli ilości<input id="quantityGap" type="number" min="30" max="100" value="58"></label><label>Punkty łączenia<select id="anchors"><option value="dots">Małe kropki</option><option value="none">Bez kropek</option></select></label><label>Ramki<select id="frames"><option value="none">Bez ramek</option><option value="soft">Delikatne kapsułki</option></select></label><label>Styl Solutions<select id="solutionStyle"><option value="lines">Linie</option><option value="numbers">Numeracja</option></select></label></div></details><details open><summary>6. Treść strony</summary><div class="fields"><label>Tytuł<input id="title" value="Match the Pairs!"></label><label>Instrukcja<input id="instructions" value="Draw a line to match each pair."></label><label>Wielkość tytułu<input id="titleSize" type="number" min="64" max="160" value="110"></label><label>Wielkość instrukcji<input id="instructionSize" type="number" min="30" max="80" value="44"></label></div></details><div class="preview"><div class="preview-tabs"><button id="taskTab" class="active" type="button">Zadanie</button><button id="solutionTab" type="button">Solution</button></div><canvas id="page" width="850" height="1100"></canvas><div id="status">Gotowy.</div></div><div class="actions"><button id="generate">Odśwież podgląd</button><button id="png">Eksport PNG</button></div><div class="actions"><button id="cart" class="primary">Dodaj stronę + Solution</button></div></main><script src="core/page-schema.js?v=3"></script><script src="core/fenix-core.js?v=3"></script><script src="matching-core.js?v=1"></script><script src="matching.js?v=1"></script><script src="fpm-shell.js?v=7"></script></body></html>
