<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e151c"><title>FPM 3.2 · Complete the Picture</title><link rel="stylesheet" href="fpm.css?v=13"><style>.ctp-help{font-size:12px;color:var(--muted);margin-top:7px}.checks{display:grid;gap:10px;margin-top:10px}.checks label{font-size:13px;font-weight:800}.preview canvas{width:100%;height:auto}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:8px}.wide{width:100%}.edit-badge{display:none;margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--soft);font-size:12px;font-weight:900;color:#c64d18}.edit-badge.on{display:block}</style></head><body><header class="top"><div><strong>FPM 3.2 · FENIX Portable Mobile</strong><small>Complete the Picture Studio · kopia logiki FP</small></div><b>TEST</b></header><main><article class="card"><span>COMPLETE THE PICTURE · FP → FPM</span><h2>Complete the Picture Studio</h2><p id="projectInfo"></p><div id="editBadge" class="edit-badge">TRYB EDYCJI · zapisujesz tę samą stronę</div></article><details open><summary>1. Rodzaj ćwiczenia</summary><div class="fields"><label>Typ zadania<select id="type"><option value="half-vertical">Dokończ drugą połowę — pionowo</option><option value="half-horizontal">Dokończ drugą połowę — poziomo</option><option value="shadow-trace">Rysuj po cieniu / śladzie</option><option value="grid-copy">Przerysuj obrazek w siatce</option><option value="missing-part">Dorysuj brakujący fragment</option><option value="mirror-pair">Narysuj odbicie lustrzane</option></select></label><label>Trudność<select id="difficulty"><option value="easy">Łatwa</option><option value="medium" selected>Średnia</option><option value="hard">Trudna</option></select></label><label>Wiek<select id="age"><option>3–5</option><option selected>5–7</option><option>7–9</option></select></label></div><div id="typeHelp" class="ctp-help"></div></details><details open><summary>2. Obrazek</summary><div class="fields"><label>Źródło obrazka<select id="assetSource"><option value="built-in">Biblioteka Feniksa</option><option value="project">Asset projektu</option><option value="upload">Własny plik</option></select></label><label id="builtInWrap">Motyw<select id="asset"><option value="butterfly">Motyl</option><option value="owl">Sowa</option><option value="rocket">Rakieta</option><option value="robot">Robot</option><option value="fish">Ryba</option><option value="flower">Kwiat</option><option value="cat">Kot</option><option value="ladybug">Biedronka</option><option value="castle">Zamek</option><option value="dino">Dinozaur</option><option value="car">Samochód</option><option value="mushroom">Grzybek</option></select></label><label id="projectAssetWrap" hidden>Asset projektu<select id="projectAsset"></select></label><label id="uploadWrap" hidden>Własny asset<input id="assetFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,.svg"></label><label>Rozmiar obrazka (%)<input id="scale" type="number" min="55" max="125" value="94"></label><label>Grubość konturu<input id="lineWidth" type="number" min="2" max="8" value="4"></label><label id="shadowStrengthField" hidden>Widoczność cienia (%)<input id="shadowStrength" type="number" min="10" max="55" value="28"></label></div><div class="checks"><label><input id="showGuide" type="checkbox" checked> Linia podziału / oś symetrii</label><label><input id="showDots" type="checkbox"> Punkty pomocnicze</label><label><input id="showGrid" type="checkbox"> Delikatna siatka pomocnicza</label></div><div id="uploadStatus" class="ctp-help"></div></details><details open><summary>3. Strona i seria</summary><div class="fields"><label>Tytuł<input id="title" value="Complete the Picture"></label><label>Instrukcja<input id="instruction" value="Draw the missing half of the picture."></label><label>Liczba stron<input id="count" type="number" min="1" max="20" value="5"></label><label>Seed serii<input id="seed" value="fenix-ctp-001"></label><label>Zawartość serii<select id="seriesMode"><option value="selected">Ten sam motyw, różne warianty</option><option value="mixed">Różne motywy automatycznie</option></select></label></div></details><div class="preview"><div class="pager"><button id="prev">←</button><span id="pageCounter">0 / 0</span><button id="next">→</button></div><canvas id="page" width="850" height="1100"></canvas><div id="status">Gotowy.</div></div><div class="actions"><button id="generate">Odśwież podgląd</button><button id="variant">Nowy wariant</button><button id="solution">Rozwiązanie</button></div><div class="actions"><button id="png">Eksport PNG</button><button id="cart" class="primary wide">Dodaj serię do projektu</button></div></main><script src="core/page-schema.js?v=3"></script><script src="core/fenix-core.js?v=3"></script><script src="complete-picture.js?v=1"></script><script src="fpm-shell.js?v=6"></script></body></html>
