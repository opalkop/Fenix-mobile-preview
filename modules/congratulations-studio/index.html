<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FPM · Congratulations Studio</title><link rel="stylesheet" href="../shared/ending-mobile.css?v=1"></head><body data-module="congratulations-studio"><header><div><p class="eyebrow">FENIX / STUDIO STRUKTURALNE</p><h1>Congratulations Studio</h1><p>Strona gratulacyjna zgodna z FPP.</p></div><div class="actions"><a href="../../index.html#home">← FPM</a><button id="png">Eksport PNG</button></div></header><main class="ending"><section class="panel"><div id="projectInfo" class="project"></div><div id="state" class="state"></div><div class="fields"><label>Tytuł<input data-setting="title" value="CONGRATULATIONS!"></label><label>Podtytuł<input data-setting="subtitle" value="YOU DID IT!"></label><label class="wide">Treść<textarea data-setting="body">You completed every challenge and reached the end of this adventure. Be proud of your focus, creativity, and determination!</textarea></label><label>Stopka<input data-setting="footer" value="Amazing work — keep exploring!"></label><label>Odstępy<select data-setting="spacing"><option value="compact">Kompaktowe</option><option value="standard" selected>Standardowe</option><option value="airy">Przestronne</option></select></label><label class="check"><input type="checkbox" data-setting="showActivityCount" checked> Pokaż liczbę aktywności</label><label>Sposób liczenia<select data-setting="countMode"><option value="auto">Automatycznie</option><option value="manual">Ręcznie</option></select></label><label>Liczba aktywności<input type="number" data-setting="activityCount" value="35"></label><label>Komunikat<input data-setting="activityCountText" value="You completed {count} activities!"></label><label class="check"><input type="checkbox" data-setting="showQrTransition" checked> Przejście do QR</label><label>Styl<select data-setting="style"><option value="clean">Bez ramki</option><option value="framed" selected>Delikatna ramka</option><option value="bold-frame">Mocniejsza ramka</option></select></label><label>Wyrównanie<select data-setting="alignment"><option value="center" selected>Do środka</option><option value="left">Do lewej</option></select></label><label>Rozmiar tytułu<select data-setting="titleSize"><option value="small">Mniejszy</option><option value="standard" selected>Standardowy</option><option value="large">Duży</option></select></label></div><div class="bottom"><button id="save">Dodaj stronę do projektu</button></div></section><section class="preview"><div class="preview-head"><strong>Podgląd strony</strong><span id="status">Gotowy</span></div><canvas id="page" width="2550" height="3300"></canvas></section></main><script src="../../core/page-schema.js?v=3"></script><script src="../../core/fenix-core.js?v=4"></script><script src="../shared/ending-renderers.js?v=1"></script><script src="../shared/ending-mobile.js?v=1"></script><script src="../../core/sync-core.js?v=2"></script><script src="../../core/sync-ui.js?v=2"></script><script>document.getElementById('projectInfo').textContent='Aktywny projekt: '+FenixCore.getActiveProject().name;</script></body></html>
