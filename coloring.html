<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e151c"><title>FPM 3.0 · Coloring Studio</title><link rel="stylesheet" href="fpm.css?v=13"><style>.asset-tools{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0}.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.asset-card{position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;text-align:left}.asset-card.selected{outline:2px solid #ff6b2c}.asset-card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:8px}.asset-card strong,.asset-card small{display:block}.asset-check{position:absolute;right:8px;top:8px;background:#111;color:#fff;border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center}.switches{display:flex;gap:12px;flex-wrap:wrap}.preview canvas{width:100%;height:auto;background:#fff;border-radius:10px}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:8px 0}.wide{width:100%}</style></head><body><header class="top"><div><strong>FPM 3.0 · FENIX Portable Mobile</strong><small>Coloring Studio · kopia logiki FP</small></div><b>TEST</b></header><main><article class="card"><span>COLORING STUDIO · SHARED CORE</span><h2>Kolorowanki z assetów projektu</h2><p id="projectInfo"></p></article><details open><summary>1. Wybierz assety</summary><div class="asset-tools"><strong id="selectionCount">Wybrano: 0</strong><button id="selectAll" type="button">Zaznacz wszystkie</button></div><div id="assetEmpty" class="card">Brak assetów w projekcie. Dodaj je wcześniej w Assetach projektu.</div><div id="assetGrid" class="asset-grid"></div></details><details open><summary>2. Ustaw stronę</summary><div class="fields"><label>Tytuł strony<input id="title" value="Color the Picture!"></label><label>Instrukcja<textarea id="instructions">Use crayons or pencils to color the picture.</textarea></label><div class="switches"><label><input id="showTitle" type="checkbox" checked> Pokaż tytuł</label><label><input id="showInstructions" type="checkbox" checked> Pokaż instrukcję</label></div><label>Rozmiar tytułu<input id="titleSize" type="number" min="64" max="180" value="112"></label><label>Rozmiar instrukcji<input id="instructionSize" type="number" min="32" max="90" value="46"></label><label>Pozycja tytułu<input id="titleY" type="number" min="140" max="420" value="230"></label><label>Wielkość assetu (%)<input id="assetScale" type="number" min="35" max="96" value="82"></label><label>Pozycja assetu (%)<input id="assetY" type="number" min="35" max="72" value="56"></label></div></details><div class="preview"><div class="pager"><button id="prev">←</button><span id="pageCounter">0 / 0</span><button id="next">→</button></div><canvas id="page" width="850" height="1100"></canvas><div id="status" class="hint">Wybierz assety projektu.</div></div><div class="actions"><button id="generate">Odśwież podgląd</button><button id="png">Eksport PNG</button><button id="cart" class="primary wide">Dodaj wybrane strony do projektu</button></div></main><script src="core/page-schema.js?v=3"></script><script src="core/production-profile.js?v=1"></script><script src="core/fenix-core.js?v=3"></script><script src="coloring-core.js?v=1"></script><script src="coloring.js?v=1"></script><script src="coloring-edit.js?v=1"></script><script src="fpm-shell.js?v=5"></script></body></html>
