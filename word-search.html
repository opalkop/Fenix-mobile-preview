<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e151c"><title>Word Search · FPM</title><link rel="stylesheet" href="fpm.css?v=6"><style>.ws-wrap{padding:12px;max-width:760px;margin:auto}.ws-wrap details{margin:10px 0}.ws-wrap textarea{min-height:150px}.ws-preview{margin-top:16px;padding:14px;background:#e9eef4;border-radius:14px}.ws-preview canvas{display:block;width:100%;height:auto;background:#fff;border:1px solid #bfcad5;box-shadow:0 16px 36px #0002;border-radius:4px}.ws-actions{display:grid;gap:8px;margin:14px 0}.ws-actions button{width:100%}.studio-nav a{display:flex;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:10px;padding:10px 6px;background:#223446;color:#d6e0e8;font-size:12px;min-width:0}.studio-nav a.active{background:var(--orange);color:#fff;font-weight:800}</style></head><body><header class="top"><div><strong>FPM · Word Search Studio</strong><small>wspólna logika FP/FPM · mobilny podgląd</small></div><b>TEST</b></header><nav class="nav studio-nav"><a href="index.html">Start</a><a href="index.html#assets">Assety</a><a href="index.html#pages">Strony</a><a href="index.html#maze">Maze</a><a class="active" href="word-search.html">WS</a></nav><main class="ws-wrap"><details open><summary>Treść strony</summary><div class="fields"><label>Tytuł<input id="wsTitle" value="Find the Words!"></label><label>Instrukcja<input id="wsInstruction" value="Find and circle the hidden words."></label></div></details><details open><summary>Wykreślanka</summary><div class="fields"><label>Grupa wiekowa<select id="wsAge"><option value="4-6">4–6</option><option value="5-7">5–7</option><option value="6-8">6–8</option></select></label><label>Poziom trudności<select id="wsDifficulty"><option value="easy">Łatwy</option><option value="medium">Średni</option><option value="hard">Trudny</option></select></label><label>Kolumny<input id="wsCols" type="number" value="9"></label><label>Wiersze<input id="wsRows" type="number" value="9"></label><label>Liczba słów<input id="wsCount" type="number" value="6"></label><label>Maks. długość słowa<input id="wsMax" type="number" value="7"></label><label>Seed<input id="wsSeed" type="number" value="1"></label></div><p id="wsInfo" class="hint"></p></details><details open><summary>Lista słów</summary><div class="fields"><label>Słowa — jedno w wierszu<textarea id="wsWords">ROCKET
MOON
STAR
SPACE
MARS
COMET</textarea></label></div></details><details><summary>Układ i rozwiązanie</summary><div class="fields"><label>Wielkość liter<input id="wsFont" type="number" value="54"></label><label>Rozwiązanie<select id="wsSolution"><option value="no">Bez rozwiązania</option><option value="yes">Pokaż rozwiązanie</option></select></label></div></details><div class="ws-actions"><button id="wsVariant">Nowy wariant</button><button id="wsSave" class="primary">Dodaj do Stron projektu</button></div><section class="ws-preview"><canvas id="wsCanvas" width="900" height="1165"></canvas><div id="wsStatus"></div></section></main><script>
const S=JSON.parse(localStorage.getItem('fpm-preview-state')||'{"assets":[],"pages":[]}'),save=()=>localStorage.setItem('fpm-preview-state',JSON.stringify(S)),q=id=>document.getElementById(id),ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const P={"4-6":{easy:[9,9,6,7,['r','d']],medium:[10,10,7,8,['r','d','dd']],hard:[12,12,8,9,['r','d','dd','du']]},"5-7":{easy:[10,10,7,8,['r','d','dd']],medium:[12,12,9,10,['r','d','dd','du']],hard:[14,14,11,11,['r','d','dd','du','l']]},"6-8":{easy:[12,12,8,10,['r','d','dd','du']],medium:[14,14,11,12,['r','d','dd','du','l']],hard:[16,16,14,14,['r','d','dd','du','l','u','bd','bu']]}};
const D={r:[1,0],d:[0,1],dd:[1,1],du:[1,-1],l:[-1,0],u:[0,-1],bd:[-1,1],bu:[-1,-1]};let dirs=['r','d'];
function rnd(seed){let s=seed||1;return()=>{let t=s+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function words(){return[...new Set(q('wsWords').value.split(/\n|,|;/).map(x=>x.trim().toUpperCase().replace(/[^A-Z]/g,'')).filter(Boolean))]}
function build(){const cols=+q('wsCols').value||9,rows=+q('wsRows').value||9,count=+q('wsCount').value||6,seed=+q('wsSeed').value||1,R=rnd(seed),grid=Array.from({length:rows},()=>Array(cols).fill('')),list=words().slice(0,count).sort((a,b)=>b.length-a.length),placed=[];for(const w of list){let cs=[];for(const k of dirs){const [dx,dy]=D[k];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const ex=x+dx*(w.length-1),ey=y+dy*(w.length-1);if(ex<0||ey<0||ex>=cols||ey>=rows)continue;let ok=true;for(let i=0;i<w.length;i++){const c=grid[y+dy*i][x+dx*i];if(c&&c!==w[i]){ok=false;break}}if(ok)cs.push({x,y,dx,dy})}}if(cs.length){const p=cs[Math.floor(R()*cs.length)],cells=[];for(let i=0;i<w.length;i++){const x=p.x+p.dx*i,y=p.y+p.dy*i;grid[y][x]=w[i];cells.push({x,y})}placed.push({word:w,cells})}}for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(!grid[y][x])grid[y][x]=ABC[Math.floor(R()*ABC.length)];return{grid,placed,list,cols,rows}}
function render(){const c=q('wsCanvas'),x=c.getContext('2d'),r=build(),w=c.width,h=c.height;x.fillStyle='#fff';x.fillRect(0,0,w,h);x.fillStyle='#111827';x.textAlign='center';x.font='700 34px Arial';x.fillText(q('wsTitle').value||'Find the Words!',w/2,70);x.font='20px Arial';x.fillText(q('wsInstruction').value||'',w/2,108);const side=70,top=170,cell=Math.min((w-side*2)/r.cols,(h-360)/r.rows),gw=cell*r.cols,gh=cell*r.rows,gx=(w-gw)/2,gy=top;x.strokeStyle='#111827';x.lineWidth=2;x.strokeRect(gx,gy,gw,gh);if(q('wsSolution').value==='yes'){x.lineCap='round';for(const p of r.placed){const a=p.cells[0],b=p.cells[p.cells.length-1];x.strokeStyle='rgba(203,213,225,.8)';x.lineWidth=cell*.72;x.beginPath();x.moveTo(gx+(a.x+.5)*cell,gy+(a.y+.5)*cell);x.lineTo(gx+(b.x+.5)*cell,gy+(b.y+.5)*cell);x.stroke()}}x.fillStyle='#111827';x.font=`700 ${Math.min(+q('wsFont').value||54,cell*.55)}px Arial`;for(let y=0;y<r.rows;y++)for(let xx=0;xx<r.cols;xx++)x.fillText(r.grid[y][xx],gx+(xx+.5)*cell,gy+(y+.65)*cell);x.font='600 20px Arial';x.fillText(r.list.join('   '),w/2,gy+gh+70);q('wsStatus').textContent=`Gotowy · ${r.cols}×${r.rows} · seed ${q('wsSeed').value} · słowa ${r.placed.length}/${r.list.length}`}
function preset(){const p=P[q('wsAge').value][q('wsDifficulty').value];[q('wsCols').value,q('wsRows').value,q('wsCount').value,q('wsMax').value,dirs]=[p[0],p[1],p[2],p[3],p[4].slice()];q('wsInfo').textContent=`Profil ${q('wsAge').value} · siatka ${p[0]}×${p[1]} · ${p[2]} słów · maks. ${p[3]} znaków.`;render()}
['wsTitle','wsInstruction','wsCols','wsRows','wsCount','wsMax','wsSeed','wsWords','wsFont','wsSolution'].forEach(id=>q(id).addEventListener('input',render));q('wsAge').onchange=preset;q('wsDifficulty').onchange=preset;q('wsVariant').onclick=()=>{q('wsSeed').value=(+q('wsSeed').value||1)+1;render()};q('wsSave').onclick=()=>{const r=build();S.pages.push({id:String(Date.now()),module:'word-search-studio',title:q('wsTitle').value||'Find the Words!',seed:+q('wsSeed').value||1,solution:{available:true},settings:{ageProfile:q('wsAge').value,difficulty:q('wsDifficulty').value,cols:r.cols,rows:r.rows,wordCount:+q('wsCount').value||6,maxWordLength:+q('wsMax').value||7,showSolution:q('wsSolution').value==='yes'},content:{words:words()}});save();alert('Word Search zapisany w projekcie.');};preset();
</script></body></html>
