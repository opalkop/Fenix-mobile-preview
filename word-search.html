<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e151c"><title>FPM 3.9 · Word Search Studio</title><link rel="stylesheet" href="fpm.css?v=13"><style>.fields textarea{width:100%;min-height:150px;margin-top:5px;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;resize:vertical}.ws-back{display:inline-block;margin:8px 0 14px;text-decoration:none;font-weight:800}.preview canvas{width:100%;height:auto}</style></head><body><header class="top"><div><strong>FPM 3.9 · FENIX Portable Mobile</strong><small>Word Search · wspólny renderer FPP/FPM</small></div><b>TEST</b></header><main><a class="ws-back" href="index.html">← Strony projektu</a><article class="card"><span>WORD SEARCH STUDIO · SHARED CORE</span><h2>Projektant wykreślanki</h2><p>Ta sama receptura, seed, siatka, Solutions i renderer na desktopie oraz mobile.</p></article><details open><summary>Treść strony</summary><div class="fields"><label>Tytuł<input id="wsTitle" value="Find the Words!"></label><label>Instrukcja<input id="wsInstruction" value="Find and circle the hidden words."></label></div></details><details open><summary>Wykreślanka</summary><div class="fields"><label>Grupa wiekowa<select id="wsAge"><option value="4-6">4–6</option><option value="5-7">5–7</option><option value="6-8">6–8</option></select></label><label>Poziom trudności<select id="wsDifficulty"><option value="easy">Łatwy</option><option value="medium">Średni</option><option value="hard">Trudny</option><option value="custom">Własny</option></select></label><label>Kolumny<input id="wsCols" type="number" min="6" max="24" value="9"></label><label>Wiersze<input id="wsRows" type="number" min="6" max="24" value="9"></label><label>Liczba słów<input id="wsCount" type="number" min="1" max="20" value="6"></label><label>Maks. długość słowa<input id="wsMax" type="number" min="3" max="16" value="7"></label><label>Seed<input id="wsSeed" type="number" value="1"></label></div><p id="wsInfo" class="hint"></p></details><details open><summary>Lista słów</summary><div class="fields"><label>Słowa — jedno w wierszu<textarea id="wsWords">ROCKET
MOON
STAR
SPACE
MARS
COMET</textarea></label></div></details><details><summary>Układ strony i rozwiązanie</summary><div class="fields"><label>Wielkość liter<input id="wsFont" type="number" min="24" max="84" value="54"></label><label>Rozwiązanie<select id="wsSolution"><option value="no">Bez rozwiązania</option><option value="yes">Pokaż rozwiązanie</option></select></label></div></details><div class="preview"><canvas id="wsCanvas" width="900" height="1165"></canvas><div id="wsStatus"></div></div><div class="actions"><button id="wsVariant">Nowy wariant</button><button id="wsSave" class="primary">Dodaj do Stron projektu</button></div></main><script src="core/page-schema.js?v=3"></script><script src="core/fenix-core.js?v=4"></script><script src="word-search-core.js?v=2"></script><script>
(()=>{const q=id=>document.getElementById(id),canvas=q('wsCanvas');let currentId=null;const PRESETS={"4-6":{easy:[9,9,6,7],medium:[10,10,7,8],hard:[12,12,8,9]},"5-7":{easy:[10,10,7,8],medium:[12,12,9,10],hard:[14,14,11,11]},"6-8":{easy:[12,12,8,10],medium:[14,14,11,12],hard:[16,16,14,14]}};function words(){return FenixWordSearch.normalizeWords(q('wsWords').value)}function directions(){return FenixWordSearch.DIRECTION_SETS[q('wsDifficulty').value]||FenixWordSearch.DIRECTION_SETS.medium}function page(){const seed=+q('wsSeed').value||1,title=q('wsTitle').value||'Find the Words!',settings={ageProfile:q('wsAge').value,difficulty:q('wsDifficulty').value,cols:+q('wsCols').value||9,rows:+q('wsRows').value||9,wordCount:+q('wsCount').value||6,maxWordLength:+q('wsMax').value||7,directions:directions(),instruction:q('wsInstruction').value||'',gridFontSize:+q('wsFont').value||54,showSolution:q('wsSolution').value==='yes',typographyVersion:2};return FenixPageSchema.normalize({module:'word-search-studio',title,seed,recipe:{module:'word-search-studio',seed,title,settings,content:{words:words()},meta:{moduleVersion:1}},content:{words:words()},solution:{available:true},production:{format:'8.5x11',bleed:'no-bleed',dpi:300,width:2550,height:3300},source:{app:'fenix-portable-mobile',version:'3.9',format:'native'}})}async function render(){const p=page(),assets=await FenixWordSearch.prepareAssets(p),out=FenixWordSearch.render(p,{canvas,width:900,height:1165,solution:q('wsSolution').value==='yes',assetImages:assets});q('wsStatus').textContent=`Gotowy · ${out.cols}×${out.rows} · seed ${p.seed} · słowa ${out.placements.length}/${out.words.length}`;q('wsInfo').textContent=`Profil ${q('wsAge').value} · ${q('wsDifficulty').value} · wspólny renderer FPP/FPM.`}function preset(){const d=q('wsDifficulty').value,p=PRESETS[q('wsAge').value]?.[d];if(p){q('wsCols').value=p[0];q('wsRows').value=p[1];q('wsCount').value=p[2];q('wsMax').value=p[3]}render()}function load(id){const raw=FenixCore.getCart().find(p=>String(p.id)===String(id));if(!raw||FenixPageSchema.moduleOf(raw)!=='word-search-studio')return;const p=FenixPageSchema.normalize(raw),s=p.recipe.settings||{};currentId=p.id;q('wsTitle').value=p.title||'Find the Words!';q('wsInstruction').value=s.instruction||'Find and circle the hidden words.';q('wsAge').value=s.ageProfile||'4-6';q('wsDifficulty').value=s.difficulty||'custom';q('wsCols').value=s.cols||9;q('wsRows').value=s.rows||9;q('wsCount').value=s.wordCount||6;q('wsMax').value=s.maxWordLength||7;q('wsSeed').value=p.recipe.seed??1;q('wsFont').value=s.gridFontSize||54;q('wsSolution').value=s.showSolution?'yes':'no';q('wsWords').value=(p.recipe.content?.words||[]).join('\n');q('wsSave').textContent='Zapisz zmiany';render()}['wsTitle','wsInstruction','wsCols','wsRows','wsCount','wsMax','wsSeed','wsWords','wsFont','wsSolution'].forEach(id=>q(id).addEventListener('input',render));q('wsAge').onchange=preset;q('wsDifficulty').onchange=preset;q('wsVariant').onclick=()=>{q('wsSeed').value=(+q('wsSeed').value||1)+1;currentId=null;q('wsSave').textContent='Dodaj do Stron projektu';render()};q('wsSave').onclick=()=>{const p=page();if(currentId)FenixCore.updatePage(currentId,p);else{FenixCore.addPage(p);currentId=FenixCore.getCart().at(-1)?.id||null}q('wsSave').textContent='Zapisz zmiany';q('wsStatus').textContent='✓ Word Search zapisany w projekcie.'};const id=new URLSearchParams(location.search).get('id');if(id)load(id);else preset()})();
</script><script src="fpm-shell.js?v=12"></script></body></html>
